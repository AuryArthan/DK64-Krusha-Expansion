name: Publish Krusha Expansion v1.0.0

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-krusha-expansion-v1.0.0
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'AuryArthan/DK64-Krusha-Expansion' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       startsWith(github.event.head_commit.message, 'Publish Krusha Expansion v1.0.0'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify patch and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash release-assets/v1.0.0/publish.sh
