name: Publish Krusha Expansion v1.1.0

on:
  push:
    tags: ['v1.1.0']

permissions:
  contents: write

concurrency: publish-krusha-expansion-v1.1.0

jobs:
  publish:
    if: github.repository == 'AuryArthan/DK64-Krusha-Expansion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify patch and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/publish-release.sh v1.1.0
